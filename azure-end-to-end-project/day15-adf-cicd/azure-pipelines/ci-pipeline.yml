# =============================================================================
# ADF CI Pipeline — EV Intelligence Project
# Repo    : azureendtoendproject (Azure DevOps)
# Trigger : push to adf_publish branch (ADF Studio publish)
#           PR validation against main
# Jobs    : validate ARM template → publish artifact
#
# Real resources:
#   Factory  : adf-ev-intelligence-dev2
#   RG       : rg-ev-intelligence-dev
#   Location : centralindia
#   Sub      : 81dd57e1-876a-4fcc-8778-e06f68c13228
# =============================================================================

trigger:
  branches:
    include:
      - adf_publish

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - name: AZURE_SUBSCRIPTION_ID
    value: 81dd57e1-876a-4fcc-8778-e06f68c13228
  - name: RESOURCE_GROUP
    value: rg-ev-intelligence-dev
  - name: AZURE_LOCATION
    value: centralindia
  - name: ARM_TEMPLATE_PATH
    value: $(Build.SourcesDirectory)/ARMTemplateForFactory.json
  - name: DEV_PARAMS_PATH
    value: $(Build.SourcesDirectory)/parameters/dev-parameters.json

stages:

  # ---------------------------------------------------------------------------
  # STAGE 1 — Validate ARM template (dry run — no changes deployed)
  # deploymentMode: Validation means Azure checks the template is valid
  # but does not create or modify any resources.
  # ---------------------------------------------------------------------------
  - stage: ValidateARM
    displayName: Validate ADF ARM Template
    jobs:

      - job: ValidateDev
        displayName: ARM Validate — Dev
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout adf_publish branch

          - task: AzureResourceManagerTemplateDeployment@3
            displayName: ARM Validate (dev-parameters.json)
            inputs:
              deploymentScope: Resource Group
              azureResourceManagerConnection: sc-ev-azure
              subscriptionId: $(AZURE_SUBSCRIPTION_ID)
              action: Create Or Update Resource Group
              resourceGroupName: $(RESOURCE_GROUP)
              location: $(AZURE_LOCATION)
              templateLocation: Linked artifact
              csmFile: $(ARM_TEMPLATE_PATH)
              csmParametersFile: $(DEV_PARAMS_PATH)
              deploymentMode: Validation
              deploymentName: adf-ci-validate-$(Build.BuildId)

  # ---------------------------------------------------------------------------
  # STAGE 2 — Publish artifact
  # Bundles ARM template + parameter file + PrePostDeploymentScript.ps1
  # so the CD pipeline can consume them without re-checking out the repo.
  # Only runs on adf_publish branch pushes (skipped on PR validation runs).
  # ---------------------------------------------------------------------------
  - stage: PublishArtifact
    displayName: Publish ARM Artifact
    dependsOn: ValidateARM
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/adf_publish'))
    jobs:
      - job: Publish
        displayName: Publish ARM template + parameters
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout adf_publish branch

          - task: CopyFiles@2
            displayName: Copy ARM template, parameters, and scripts
            inputs:
              SourceFolder: $(Build.SourcesDirectory)
              Contents: |
                ARMTemplateForFactory.json
                ARMTemplateParametersForFactory.json
                parameters/dev-parameters.json
                scripts/PrePostDeploymentScript.ps1
              TargetFolder: $(Build.ArtifactStagingDirectory)/adf-arm

          - task: PublishBuildArtifacts@1
            displayName: Publish artifact — adf-arm
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/adf-arm
              ArtifactName: adf-arm
              publishLocation: Container
