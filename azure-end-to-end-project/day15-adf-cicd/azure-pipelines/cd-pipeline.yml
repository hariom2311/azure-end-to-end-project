# =============================================================================
# ADF CD Pipeline — EV Intelligence Project
# Repo    : azureendtoendproject (Azure DevOps)
# Trigger : completion of ADF-CI pipeline on adf_publish branch
# Stages  : Deploy Dev (auto) → Deploy Production (manual approval)
#
# Real resources:
#   Factory  : adf-ev-intelligence-dev2
#   RG       : rg-ev-intelligence-dev
#   Location : centralindia
#   Sub      : 81dd57e1-876a-4fcc-8778-e06f68c13228
#   Trigger  : bronze_load (ScheduleTrigger — daily at 16:00 IST)
#   Pipelines: pl_bronze_master_foreach, pl_bronze_master_parallel,
#              pl_silver_dynamic_foreach, pl_gold_dynamic_foreach
# =============================================================================

trigger: none

resources:
  pipelines:
    - pipeline: ADF_CI
      source: ADF-CI
      trigger:
        branches:
          include:
            - adf_publish

pool:
  vmImage: ubuntu-latest

variables:
  - name: AZURE_SUBSCRIPTION_ID
    value: 81dd57e1-876a-4fcc-8778-e06f68c13228
  - name: AZURE_LOCATION
    value: centralindia
  - name: SERVICE_CONNECTION
    value: sc-ev-azure
  - name: ADF_RESOURCE_GROUP
    value: rg-ev-intelligence-dev
  - name: ADF_FACTORY_NAME
    value: adf-ev-intelligence-dev2
  - name: ADF_TRIGGER_NAME
    value: bronze_load

stages:

  # ===========================================================================
  # STAGE 1 — Deploy to Dev
  # Runs automatically when CI passes. No approval required.
  # ===========================================================================
  - stage: DeployDev
    displayName: Deploy to Dev
    variables:
      - group: vg-adf-dev
    jobs:
      - deployment: DeployADFDev
        displayName: Deploy ADF ARM — Dev
        environment: adf-dev
        strategy:
          runOnce:
            deploy:
              steps:

                # ── Download ARM artifact from CI ───────────────────────────
                - task: DownloadBuildArtifacts@1
                  displayName: Download adf-arm artifact
                  inputs:
                    buildType: specific
                    project: $(System.TeamProject)
                    pipeline: ADF-CI
                    buildVersionToDownload: latest
                    artifactName: adf-arm
                    downloadPath: $(Pipeline.Workspace)/adf-arm

                # ── Stop bronze_load trigger before deploy ──────────────────
                # Prevents the trigger from firing mid-deploy while ARM is
                # partially applied to the factory.
                - task: AzurePowerShell@5
                  displayName: Stop ADF triggers (pre-deploy)
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    ScriptType: FilePath
                    ScriptPath: $(Pipeline.Workspace)/adf-arm/scripts/PrePostDeploymentScript.ps1
                    ScriptArguments: >
                      -armTemplate "$(Pipeline.Workspace)/adf-arm/ARMTemplateForFactory.json"
                      -ResourceGroupName "$(ADF_RESOURCE_GROUP)"
                      -DataFactoryName "$(ADF_FACTORY_NAME)"
                      -preDeployment $true
                      -deleteDeployment $false
                    azurePowerShellVersion: LatestVersion

                # ── Deploy ARM template ─────────────────────────────────────
                - task: AzureResourceManagerTemplateDeployment@3
                  displayName: ARM Deploy — Dev (adf-ev-intelligence-dev2)
                  inputs:
                    deploymentScope: Resource Group
                    azureResourceManagerConnection: $(SERVICE_CONNECTION)
                    subscriptionId: $(AZURE_SUBSCRIPTION_ID)
                    action: Create Or Update Resource Group
                    resourceGroupName: $(ADF_RESOURCE_GROUP)
                    location: $(AZURE_LOCATION)
                    templateLocation: Linked artifact
                    csmFile: $(Pipeline.Workspace)/adf-arm/ARMTemplateForFactory.json
                    csmParametersFile: $(Pipeline.Workspace)/adf-arm/parameters/dev-parameters.json
                    deploymentMode: Incremental
                    deploymentName: adf-cd-dev-$(Build.BuildId)

                # ── Restart bronze_load trigger after deploy ────────────────
                - task: AzurePowerShell@5
                  displayName: Restart ADF triggers (post-deploy)
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    ScriptType: FilePath
                    ScriptPath: $(Pipeline.Workspace)/adf-arm/scripts/PrePostDeploymentScript.ps1
                    ScriptArguments: >
                      -armTemplate "$(Pipeline.Workspace)/adf-arm/ARMTemplateForFactory.json"
                      -ResourceGroupName "$(ADF_RESOURCE_GROUP)"
                      -DataFactoryName "$(ADF_FACTORY_NAME)"
                      -preDeployment $false
                      -deleteDeployment $false
                    azurePowerShellVersion: LatestVersion

                # ── Smoke test — verify pl_bronze_master_foreach exists ─────
                - task: AzurePowerShell@5
                  displayName: Smoke test — verify pl_bronze_master_foreach
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    ScriptType: InlineScript
                    Inline: |
                      $pipeline = Get-AzDataFactoryV2Pipeline `
                        -ResourceGroupName "$(ADF_RESOURCE_GROUP)" `
                        -DataFactoryName "$(ADF_FACTORY_NAME)" `
                        -Name "pl_bronze_master_foreach" `
                        -ErrorAction SilentlyContinue

                      if (-not $pipeline) {
                        Write-Error "pl_bronze_master_foreach not found in $(ADF_FACTORY_NAME)"
                        exit 1
                      }
                      Write-Host "Dev deploy verified: pl_bronze_master_foreach exists in $(ADF_FACTORY_NAME)"
                    azurePowerShellVersion: LatestVersion

                # ── Summary ─────────────────────────────────────────────────
                - script: |
                    echo "ADF deployed to DEV"
                    echo "Factory : $(ADF_FACTORY_NAME)"
                    echo "RG      : $(ADF_RESOURCE_GROUP)"
                    echo "Build   : $(Build.BuildId)"
                    echo "Commit  : $(Build.SourceVersion)"
                  displayName: Deployment summary — Dev

  # ===========================================================================
  # STAGE 2 — Deploy to Production
  # Requires manual approval via the adf-production environment gate.
  # Only runs after Dev deploy succeeds.
  # ===========================================================================
  - stage: DeployProduction
    displayName: Deploy to Production
    dependsOn: DeployDev
    condition: succeeded()
    variables:
      - group: vg-adf-dev
    jobs:
      - deployment: DeployADFProduction
        displayName: Deploy ADF ARM — Production
        environment: adf-production
        strategy:
          runOnce:
            deploy:
              steps:

                # ── Download artifact ───────────────────────────────────────
                - task: DownloadBuildArtifacts@1
                  displayName: Download adf-arm artifact
                  inputs:
                    buildType: specific
                    project: $(System.TeamProject)
                    pipeline: ADF-CI
                    buildVersionToDownload: latest
                    artifactName: adf-arm
                    downloadPath: $(Pipeline.Workspace)/adf-arm

                # ── Stop triggers ───────────────────────────────────────────
                - task: AzurePowerShell@5
                  displayName: Stop ADF triggers (pre-deploy)
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    ScriptType: FilePath
                    ScriptPath: $(Pipeline.Workspace)/adf-arm/scripts/PrePostDeploymentScript.ps1
                    ScriptArguments: >
                      -armTemplate "$(Pipeline.Workspace)/adf-arm/ARMTemplateForFactory.json"
                      -ResourceGroupName "$(ADF_RESOURCE_GROUP)"
                      -DataFactoryName "$(ADF_FACTORY_NAME)"
                      -preDeployment $true
                      -deleteDeployment $false
                    azurePowerShellVersion: LatestVersion

                # ── Deploy ARM template ─────────────────────────────────────
                - task: AzureResourceManagerTemplateDeployment@3
                  displayName: ARM Deploy — Production (adf-ev-intelligence-dev2)
                  inputs:
                    deploymentScope: Resource Group
                    azureResourceManagerConnection: $(SERVICE_CONNECTION)
                    subscriptionId: $(AZURE_SUBSCRIPTION_ID)
                    action: Create Or Update Resource Group
                    resourceGroupName: $(ADF_RESOURCE_GROUP)
                    location: $(AZURE_LOCATION)
                    templateLocation: Linked artifact
                    csmFile: $(Pipeline.Workspace)/adf-arm/ARMTemplateForFactory.json
                    csmParametersFile: $(Pipeline.Workspace)/adf-arm/parameters/dev-parameters.json
                    deploymentMode: Incremental
                    deploymentName: adf-cd-production-$(Build.BuildId)

                # ── Restart triggers ────────────────────────────────────────
                - task: AzurePowerShell@5
                  displayName: Restart ADF triggers (post-deploy)
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    ScriptType: FilePath
                    ScriptPath: $(Pipeline.Workspace)/adf-arm/scripts/PrePostDeploymentScript.ps1
                    ScriptArguments: >
                      -armTemplate "$(Pipeline.Workspace)/adf-arm/ARMTemplateForFactory.json"
                      -ResourceGroupName "$(ADF_RESOURCE_GROUP)"
                      -DataFactoryName "$(ADF_FACTORY_NAME)"
                      -preDeployment $false
                      -deleteDeployment $false
                    azurePowerShellVersion: LatestVersion

                # ── Smoke test ──────────────────────────────────────────────
                - task: AzurePowerShell@5
                  displayName: Smoke test — verify pl_bronze_master_foreach
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    ScriptType: InlineScript
                    Inline: |
                      $pipeline = Get-AzDataFactoryV2Pipeline `
                        -ResourceGroupName "$(ADF_RESOURCE_GROUP)" `
                        -DataFactoryName "$(ADF_FACTORY_NAME)" `
                        -Name "pl_bronze_master_foreach" `
                        -ErrorAction SilentlyContinue

                      if (-not $pipeline) {
                        Write-Error "pl_bronze_master_foreach not found in $(ADF_FACTORY_NAME)"
                        exit 1
                      }

                      # Also verify Silver and Gold pipelines
                      foreach ($pl in @("pl_silver_dynamic_foreach", "pl_gold_dynamic_foreach")) {
                        $p = Get-AzDataFactoryV2Pipeline `
                          -ResourceGroupName "$(ADF_RESOURCE_GROUP)" `
                          -DataFactoryName "$(ADF_FACTORY_NAME)" `
                          -Name $pl -ErrorAction SilentlyContinue
                        if (-not $p) {
                          Write-Warning "$pl not found — may not be deployed yet"
                        } else {
                          Write-Host "Verified: $pl exists"
                        }
                      }
                      Write-Host "Production deploy verified: $(ADF_FACTORY_NAME)"
                    azurePowerShellVersion: LatestVersion

                # ── Tag the release ─────────────────────────────────────────
                - task: AzurePowerShell@5
                  displayName: Tag production release
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    ScriptType: InlineScript
                    Inline: |
                      $sha8 = "$(Build.SourceVersion)".Substring(0, 8)
                      $tag  = "adf-release-$(Get-Date -Format 'yyyyMMdd-HHmmss')-$sha8"
                      Write-Host "Tagging release: $tag"
                      git config user.email "devops-bot@ev-intelligence.com"
                      git config user.name  "DevOps Bot"
                      git tag $tag
                      git push origin $tag
                      Write-Host "Tagged: $tag"
                    azurePowerShellVersion: LatestVersion

                # ── Summary ─────────────────────────────────────────────────
                - script: |
                    echo "ADF deployed to PRODUCTION"
                    echo "Factory : $(ADF_FACTORY_NAME)"
                    echo "RG      : $(ADF_RESOURCE_GROUP)"
                    echo "Build   : $(Build.BuildId)"
                    echo "Commit  : $(Build.SourceVersion)"
                  displayName: Deployment summary — Production
